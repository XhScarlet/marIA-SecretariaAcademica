<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari - Chat Widget</title>
    <link rel="stylesheet" href="estilos/index.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Sobrescreve estilos globais para o modo Widget (Iframe) */
        body {
            background: transparent !important;
            background-image: none !important;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body::before {
            display: none !important;
        }

        /* O chat ocupa 100% do iframe, sem bordas arredondadas externas pra encaixar perfeitamente */
        .chat-container {
            width: 100%;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            box-shadow: none;
            margin: 0;
            border: none;
            display: flex;
            flex-direction: column;
        }
        
        /* Ajuste do botão de fechar (opcional) caso queira colocar dentro do chat */
        .close-widget-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar"></div>
            <div class="header-info">
                <h2>Mari - Secretaria Digital</h2>
                <p>Online • FATEC Zona Sul</p>
            </div>
            <button id="toggleVoice" class="voice-btn" title="Ativar/Desativar Voz"><i class="ph ph-speaker-high"></i></button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message msg-mari" id="msgBoasVindas">
                Oi, colega! Sou a Mari, assistente da secretaria. Digite seu RA e me diga como posso ajudar hoje!
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Digite sua mensagem aqui...">
            
            <input type="file" id="fileInput" style="display: none;" accept=".pdf,.png,.jpg,.jpeg">
            <button id="attachBtn" title="Anexar Comprovante" style="background: none; border: none; font-size: 24px; cursor: pointer; margin-right: 10px; color: #555;"><i class="ph ph-paperclip"></i></button>
            
            <button id="micBtn" class="mic-btn" title="Segure para falar"><i class="ph ph-microphone"></i></button>
            <button id="sendBtn"><i class="ph-fill ph-paper-plane-right"></i></button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
