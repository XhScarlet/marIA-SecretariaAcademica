<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secretaria Digital - FATEC ZS</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

    <div class="page-wrapper">

        <div class="fatec-logo-top">
            <img src="avatar/logo_fatec1.png" alt="Logo FATEC Zona Sul">
            <div style="display: flex; gap: 15px; align-items: center;">
                <button id="toggleTheme" class="topbar-icon-btn" title="Alternar Modo Escuro"><i
                        class="ph ph-moon"></i></button>
                <div class="lang-selector">
                    <button class="lang-btn active" data-lang="pt-BR" title="Português">BR</button>
                    <button class="lang-btn" data-lang="en-US" title="English">US</button>
                    <button class="lang-btn" data-lang="es-ES" title="Español">ES</button>
                </div>
                <div class="topbar-links">
                    <a class="admin-link" href="validar.php">Validador de Documento</a>
                    <a class="admin-link highlight" href="api/login.php">Painel da Mari</a>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="avatar"></div>
                <div class="header-info">
                    <h2>Mari - Secretaria Digital</h2>
                    <p>Online • FATEC Zona Sul</p>
                </div>
                <button id="toggleVoice" class="voice-btn" title="Ativar/Desativar Voz"><i
                        class="ph ph-speaker-high"></i></button>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message msg-mari" id="msgBoasVindas">
                    Oi, colega! Sou a Mari, assistente da secretaria. Digite seu RA e me diga como posso ajudar hoje!
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Digite sua mensagem aqui...">

                <input type="file" id="fileInput" style="display: none;" accept=".pdf,.png,.jpg,.jpeg">
                <button id="attachBtn" title="Anexar Comprovante"
                    style="background: none; border: none; font-size: 24px; cursor: pointer; margin-right: 10px; color: #555;"><i
                        class="ph ph-paperclip"></i></button>

                <button id="micBtn" class="mic-btn" title="Segure para falar"><i class="ph ph-microphone"></i></button>
                <button id="sendBtn"><i class="ph-fill ph-paper-plane-right"></i></button>
            </div>
        </div>

        <div class="mari-full-body">
            <img id="mariStatic" src="avatar/marisemfundo1.png" alt="Mari, Assistente Virtual">
            <video id="mariVideo" src="avatar/Video Project-Picsart-BackgroundRemover.webm" loop muted playsinline
                style="opacity: 0;"></video>
        </div>

    </div>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="js/chat.js?v=3"></script>
</body>

</html>
